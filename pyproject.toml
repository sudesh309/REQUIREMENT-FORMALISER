[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmlv2-core-engine"
version = "0.1.0"
description = "KerML-based SysML v2 core engine"
requires-python = ">=3.10"
authors = [{ name = "Requirement Formaliser" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sysml-cli = "engine.cli:main"
sysml-web = "webapp.server:main"
sysml-mcp = "mcp_server.server:main"
sysml-gui = "gui.app:main"

[tool.setuptools.packages.find]
include = ["kerml*", "sysmlv2*", "engine*", "gui*", "webapp*", "mcp_server*"]

[tool.setuptools.package-data]
webapp = ["static/*", "static/**/*"]
