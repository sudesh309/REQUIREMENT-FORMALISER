[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmlv2-core-engine"
version = "0.1.0"
description = "KerML-based SysML v2 core engine"
requires-python = ">=3.10"
authors = [{ name = "Requirement Formaliser" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sysml-cli = "engine.cli:main"
sysml-web = "webapp.server:main"
sysml-mcp = "mcp_server.server:main"
sysml-gui = "gui.app:main"

[tool.setuptools.packages.find]
include = ["kerml*", "sysmlv2*", "engine*", "gui*", "webapp*", "mcp_server*", "sysml_spec", "sysml_text*"]

[tool.setuptools.package-data]
webapp = ["static/*", "static/**/*"]
# The normative libraries and grammars (EPL-2.0, see sysml_spec/NOTICE.md); the example
# corpus is for conformance tests only and is not installed.
sysml_spec = ["LICENSE", "NOTICE.md", "bnf/*", "library/**/*.kerml", "library/**/*.sysml",
              "library/**/.meta.json", "library/**/.project.json"]
